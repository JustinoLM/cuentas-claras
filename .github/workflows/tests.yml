name: Tests
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    if: github.event.pull_request.draft != true
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test -project "Cuentas Claras/Cuentas Claras.xcodeproj" -scheme "Cuentas Claras" -destination "platform=iOS Simulator,name=iPhone 17" 2>&1 | grep -E "error:|Test Suite|passed|failed|BUILD"
